name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          # Windows is experimental — keep visible but non-blocking for green main.
          - os: windows-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

      - name: release build + once sample
        shell: bash
        run: |
          cargo build --release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="target/release/heim.exe"
          else
            BIN="target/release/heim"
          fi
          "$BIN" --once --json . > heim-stats.json
          grep -q '"schema": "heim.stats.v1"' heim-stats.json
          grep -q '"version"' heim-stats.json

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: build --locked
        run: cargo build --locked

  # The TUI is the part CI never exercised — every panic found so far lived
  # here, including one that only fired on terminals shorter than 15 rows.
  tui-smoke:
    name: TUI smoke (tiny terminals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: render at hostile sizes
        run: cargo test --all-targets -- --nocapture ui::tests

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Verifies `exclude` keeps the tarball lean and that the crate still
      # builds from the packaged sources alone.
      - name: list packaged files
        run: cargo package --locked --list
      - name: build from tarball
        run: cargo package --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
