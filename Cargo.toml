[package]
name = "heim"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Real-time project monitor for AI coding sessions (LOC, size, git) — TUI + JSON"
license = "MIT"
readme = "README.md"
authors = ["aiatsuk"]
repository = "https://github.com/aiatsuk/heim"
homepage = "https://github.com/aiatsuk/heim"
documentation = "https://github.com/aiatsuk/heim#readme"
keywords = ["cli", "tui", "cloc", "metrics", "monitor"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
