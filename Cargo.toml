[package]
name = "heim-monitor"
version = "0.1.0"
edition = "2021"
# Transitive deps (ignore, darling, home) currently require 1.88+.
rust-version = "1.88"
description = "Stop vibe-code bloat: real-time LOC/size/git deltas + JSON agents can self-audit"
license = "MIT"
readme = "README.md"
authors = ["aiatsuk"]
repository = "https://github.com/aiatsuk/heim"
homepage = "https://github.com/aiatsuk/heim"
documentation = "https://github.com/aiatsuk/heim#readme"
keywords = ["cli", "tui", "ai", "metrics", "monitor"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "target/*",
    ".heim/*",
    "docs/*",
    "dist/*",
    "scripts/*",
    "skills/*",
    ".github/*",
]

# Binary stays `heim` (crate is `heim-monitor` — crates.io name `heim` is taken).
[[bin]]
name = "heim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
# Parallel, work-stealing directory walker (ripgrep's). Used as a raw walker —
# heim applies its own ignore rules, not .gitignore (see `standard_filters`).
ignore = "0.4"
ratatui = "0.29"
# FxHashMap: non-cryptographic hasher for the hot per-file size accumulation.
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Host CPU / RAM / network for the TUI strip. Minimal features — no disks,
# components, or users. Rates need two samples; see `host::HostMonitor`.
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
# In-process LOC counting. Replaces shelling out to `cloc` (a Perl script that
# cost ~91% of every sample's wall clock and re-walked the whole tree).
tokei = { version = "13", default-features = false }

# cargo-binstall: pick the right GitHub Release asset.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/heim-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Lint policy lives here, not only in a CI flag, so local `cargo clippy` and
# rust-analyzer enforce the same rules. Every lint below sits at zero
# diagnostics on the current tree.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Nursery lint: keep at warn so a clippy version bump cannot turn main red.
redundant_clone = "warn"
uninlined_format_args = "deny"
needless_continue = "deny"
cloned_instead_of_copied = "deny"
explicit_iter_loop = "deny"
semicolon_if_nothing_returned = "deny"
inefficient_to_string = "deny"
manual_let_else = "deny"
# Enforces clippy.toml's disallowed-methods: every subprocess must go through
# `collect::run_timed` for its timeout and pipe draining.
disallowed_methods = "deny"

[profile.release]
lto = true
codegen-units = 1
# NOT `strip = true`: keeping function symbols keeps `samply` / `perf` /
# Instruments output readable, which is the difference between profiling this
# binary and guessing. Debug-map entries are still dropped.
strip = "debuginfo"
# Explicitly NOT `panic = "abort"`: `collect()` degrades gracefully by catching
# collector-thread panics via `JoinHandle::join()`. Aborting would kill the TUI
# instead of falling back to the walk engine.
panic = "unwind"
