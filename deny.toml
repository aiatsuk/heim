# cargo-deny: supply-chain gate for a ~115-crate graph.
# Run locally with: cargo deny check advisories licenses bans sources

[advisories]
# Fail on a crate that has been pulled from the registry.
yanked = "deny"
# Only flag *unmaintained* crates we could actually act on. Security
# vulnerabilities still fail the check everywhere — being unmaintained is not
# one. `tokei` transitively pulls `paste` (RUSTSEC-2024-0436) and, under
# `--all-features`, `term_size` (RUSTSEC-2020-0163); neither is heim's to fix,
# and denying them would leave main red until an upstream we do not control
# cuts a release.
unmaintained = "workspace"

[licenses]
# Everything heim ships must be redistributable under these.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
]

[bans]
# Warn, not deny: most duplicate versions live in transitive trees heim does
# not control (tokei's, clap's). Denying would block on someone else's bump.
multiple-versions = "warn"
# A wildcard dependency makes builds unreproducible — that one is ours to keep out.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
